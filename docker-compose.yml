services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: farmiq
      POSTGRES_USER: farmiq
      POSTGRES_PASSWORD: farmiq
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U farmiq -d farmiq"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://farmiq:farmiq@postgres:5432/farmiq
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./apps/api
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://farmiq:farmiq@postgres:5432/farmiq
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api

  beat:
    build:
      context: ./apps/api
    command: celery -A app.worker.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://farmiq:farmiq@postgres:5432/farmiq
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    environment:
      API_INTERNAL_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  postgres_data:
