[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "farmiq-api"
version = "0.1.0"
description = "FarmIQ production-oriented MVP API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.35,<0.36",
  "sqlalchemy>=2.0.40,<2.1",
  "asyncpg>=0.30,<0.31",
  "aiosqlite>=0.21,<0.22",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<0.29",
  "celery[redis]>=5.5,<5.6",
  "redis>=6.2,<7",
  "ortools>=9.12,<10",
  "pgvector>=0.4,<0.5",
  "PyJWT>=2.10,<3",
  "python-multipart>=0.0.20,<0.1",
  "alembic>=1.16,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
